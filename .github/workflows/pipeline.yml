name: Main pipeline workflow
on: push
jobs:
  lint_code_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3
      - name: NodeJs setup
        uses: actions/node-setup@v3
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Code lint analysis
        run: npm run lint
      - name: Finished message
        run: echo "Code lint analysis completed..."
  test:
    needs: lint_code_analysis
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3
      - name: NodeJs setup
        uses: actions/node-setup@v3
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Run e2e tests
        run: npm test
      - name: Finished message
        run: echo "Tests execution completed..."
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3
      - name: NodeJs setup
        uses: actions/setup-node@v3
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Deploy application
        run: npm run build
      - name: Finished message
        run: echo "Application deploy completed..." 