name: Issues pipeline
on: issues
jobs:
  issues-job:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3
      - name: NodeJs setup
        uses: actions/setup-node@v3
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Print workflow event trigger
        run: echo "This workflow was triggered by the following event:${{ toJSON(github.event_name) }}"
      - name: Print workflow event trigger detailed info
        run: echo "This is the detailed workflow event trigger info:${{ toJSON(github.event) }}"
      - name: Finished message
        run: echo "Issues workflow execution completed..."